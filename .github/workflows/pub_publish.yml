# Publishes mxc_sdk_dart to pub.dev from a release tag
# (pub-mxc_sdk_dart-v1.2.3), with telosnex_ci_tools' pub_publish.yml. On pub.dev,
# the package's Admin page allows automated publishing from this repository:
# tag pattern pub-mxc_sdk_dart-v{{version}}, environment pub.dev.
name: Pub publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to validate without publishing (pub-mxc_sdk_dart-v0.1.0).
        type: string
        required: true
  push:
    tags: ['pub-mxc_sdk_dart-v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

jobs:
  publish:
    uses: Telosnex/telosnex_ci_tools/.github/workflows/pub_publish.yml@d807dca8c92f4b85be742a04601a47654f0e41a0 # v0.5.23
    permissions:
      contents: write # the published branch
      id-token: write
    with:
      dry-run: ${{ github.event_name == 'workflow_dispatch' }}
      tag: ${{ inputs.tag || '' }}
      test: dart test
