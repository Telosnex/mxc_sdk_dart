name: Kiln release
run-name: Kiln release / ${{ (github.ref_name == 'kiln-release-dry' || inputs.dry_run) && 'build only' || 'publish' }}

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build only, upload nothing.
        type: boolean
        default: false
  push:
    branches: [kiln-release, kiln-release-dry]

permissions:
  contents: read

jobs:
  kiln-release:
    uses: Telosnex/telosnex_ci_tools/.github/workflows/kiln_release.yml@06c7b3a7929d822adcec028a8baf4d7e960bb324 # v0.5.21
    permissions:
      contents: write
    with:
      dry-run: ${{ inputs.dry_run == true }}
      targets: '["windows-x64", "windows-arm64"]'
